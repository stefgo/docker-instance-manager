name: Build and Version Client and Server

on:
    push:
        branches: ["main"]
        tags: ["v*.*.*"] # Reacts to tags like v1.0.2
    workflow_dispatch: # Allows manual trigger in the Actions tab

env:
    REGISTRY: ghcr.io

jobs:
    # Typecheck and lint before anything is published. Reuses ci.yml rather than
    # restating the steps, so the release gate cannot drift from the branch checks.
    verify:
        uses: ./.github/workflows/ci.yml
        permissions:
            contents: read
            packages: read

    # The single source of the version string and of the smoke test's image
    # reference, consumed by every job below.
    prepare:
        needs: verify
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            # The reference the smoke job pulls. docker/metadata-action assigns this tag via
            # `type=sha,prefix=sha-` on every trigger, so it always exists and always means
            # exactly this build -- `main` or `latest` would be ambiguous once runs overlap.
            sha_tag: ${{ steps.version.outputs.sha_tag }}
        steps:
            - name: Determine Version
              id: version
              run: |
                  echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
                  if [[ $GITHUB_REF == refs/tags/* ]]; then
                    echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
                  else
                    echo "version=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
                  fi

    # Both images ship as real multi-arch manifests. Each architecture is built on a
    # native runner -- no QEMU, which made the arm64 half several times slower than
    # the amd64 one -- and pushed by digest only, without a tag. `merge` assembles
    # the manifest list and attaches the tags.
    build:
        needs: prepare
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write

        strategy:
            fail-fast: false
            matrix:
                image: [server, client]
                arch: [amd64, arm64]
                include:
                    - arch: amd64
                      runner: ubuntu-latest
                      platform: linux/amd64
                    - arch: arm64
                      runner: ubuntu-24.04-arm
                      platform: linux/arm64

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to the Container registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # Tags are attached by the merge job; here only the labels are needed.
            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/dim-${{ matrix.image }}

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./docker/Dockerfile.${{ matrix.image }}
                  platforms: ${{ matrix.platform }}
                  build-args: |
                      APP_VERSION=${{ needs.prepare.outputs.version }}
                  # Pass GitHub token as secret for npm authentication
                  secrets: |
                      npm_token=${{ secrets.NPM_TOKEN }}
                  labels: ${{ steps.meta.outputs.labels }}
                  # One cache per image and architecture, or the four jobs would
                  # overwrite each other's layers.
                  cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
                  outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/dim-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

            # The file name is the digest; the file itself stays empty. It is the
            # cheapest way to hand a string from a matrix job to a later job --
            # matrix jobs cannot each set an output of their own.
            - name: Export digest
              env:
                  DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                  mkdir -p /tmp/digests
                  touch "/tmp/digests/${DIGEST#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@v4
              with:
                  name: digests-${{ matrix.image }}-${{ matrix.arch }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    merge:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        strategy:
            fail-fast: false
            matrix:
                image: [server, client]

        steps:
            - name: Download digests
              uses: actions/download-artifact@v4
              with:
                  path: /tmp/digests
                  pattern: digests-${{ matrix.image }}-*
                  merge-multiple: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to the Container registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/dim-${{ matrix.image }}
                  tags: |
                      # For a push to main: Uses the branch name (main) and the SHA
                      type=ref,event=branch
                      type=sha,prefix=sha-

                      # For a git tag (v1.0.0): Creates version tags AND the latest tag
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

            - name: Create manifest list and push
              working-directory: /tmp/digests
              env:
                  IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/dim-${{ matrix.image }}
              run: |
                  mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
                  refs=()
                  for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
                  docker buildx imagetools create "${tags[@]}" "${refs[@]}"

            - name: Inspect image
              env:
                  IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/dim-${{ matrix.image }}
                  VERSION: ${{ steps.meta.outputs.version }}
              run: docker buildx imagetools inspect "$IMAGE:$VERSION"

    # Starts what was just published and asks it whether it is alive. The only place in the
    # pipeline where the images are executed -- everything before proves that the code
    # compiles, not that the result starts. amd64 only for now.
    smoke:
        name: Smoke test
        needs: [prepare, merge]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: read

        steps:
            - name: Log in to the Container registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # A fresh server without config.yaml generates its secret and starts.
            - name: Start the server image
              run: |
                  docker run -d --name dim-smoke-server -p 3000:3000 \
                    ${{ env.REGISTRY }}/${{ github.repository_owner }}/dim-server:${{ needs.prepare.outputs.sha_tag }}

            # The agent refuses to start without a reachable Docker API, so it gets the
            # runner's socket. Unregistered, it idles with its web UI up -- the state of a
            # fresh installation.
            - name: Start the client image
              run: |
                  docker run -d --name dim-smoke-client -p 3001:3001 \
                    -v /var/run/docker.sock:/var/run/docker.sock \
                    ${{ env.REGISTRY }}/${{ github.repository_owner }}/dim-client:${{ needs.prepare.outputs.sha_tag }}

            - name: Wait for both to report healthy
              run: |
                  probe() {
                    local name=$1 url=$2
                    for i in $(seq 1 60); do
                      if curl -fsS "$url" | grep -q '"status":"ok"'; then
                        echo "$name answered after ${i}s"
                        return 0
                      fi
                      # A container that already exited will never answer.
                      if [ "$(docker inspect -f '{{.State.Running}}' "$name")" != "true" ]; then
                        echo "::error::$name is no longer running"
                        return 1
                      fi
                      sleep 1
                    done
                    echo "::error::$name did not become healthy within 60s"
                    return 1
                  }
                  probe dim-smoke-server http://127.0.0.1:3000/api/health
                  probe dim-smoke-client http://127.0.0.1:3001/api/health

            - name: Container logs
              if: failure()
              run: |
                  echo "::group::server"; docker logs dim-smoke-server 2>&1 | tail -50; echo "::endgroup::"
                  echo "::group::client"; docker logs dim-smoke-client 2>&1 | tail -50; echo "::endgroup::"

            - name: Clean up
              if: always()
              run: docker rm -f dim-smoke-server dim-smoke-client 2>/dev/null || true
