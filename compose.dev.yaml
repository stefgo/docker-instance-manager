services:
    server-dev:
        build:
            context: .
            dockerfile: docker/Dockerfile.server.dev
            secrets:
                - npm_token
        image: dim-server-dev
        container_name: dim-server-dev
        hostname: dim-server-dev

        # Mount source code
        volumes:
            - ./server:/app/server
            - ./shared:/app/shared
            - ./package.json:/app/package.json
            - ./package-lock.json:/app/package-lock.json

            # Preserve Linux node_modules
            - /app/node_modules
            - /app/server/backend/node_modules
            - /app/server/frontend/node_modules
            - /app/shared/node_modules
            # Note: server might need client's types depending on shared, so we keep the structure
            - /app/client/node_modules

            # Mount local UI components for development
            - ../react-ui-components:/app/react-ui-components

        working_dir: /app

        # Start server in watch mode
        command: npm run dev -w server/backend

        # Expose API port
        ports:
            - "3000:3000"

        environment:
            - LOG_LEVEL=debug
            - NODE_ENV=development
            - VITE_USE_LOCAL_UI=true
            - VITE_UI_COMPONENTS_PATH=/app/react-ui-components

        # The dev image's CMD is bash and declares no HEALTHCHECK, so this is the only health
        # signal the dev container has. Longer start period: tsx has to compile first.
        healthcheck:
            test: ["CMD", "node", "-e", "Promise.resolve().then(() => fetch(JSON.parse(require('fs').readFileSync('/tmp/dim-health.json', 'utf8')).url)).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
            interval: 15s
            timeout: 5s
            start_period: 45s
            retries: 3

    client-dev:
        build:
            context: .
            dockerfile: docker/Dockerfile.client.dev
            secrets:
                - npm_token
        image: dim-client-dev
        platform: linux/amd64
        container_name: dim-client-dev
        hostname: dim-client-dev

        depends_on:
            - server-dev

        volumes:
            - ./client:/app/client
            - ./shared:/app/shared
            - ./package.json:/app/package.json
            - ./package-lock.json:/app/package-lock.json

            # Preserve Linux node_modules
            - /app/node_modules
            - /app/client/node_modules
            - /app/shared/node_modules
            - /app/server/backend/node_modules

            # Mount local UI components for development
            - ../react-ui-components:/app/react-ui-components

            # Docker socket for container management
            - /var/run/docker.sock:/var/run/docker.sock

            # Mount host filesystem
            - /:/mnt

        working_dir: /app

        # Command to start the client dev
        command: npm run dev -w client

        stdin_open: true
        tty: true

        # Expose API port
        ports:
            - "3001:3001"

        environment:
            - LOG_LEVEL=debug
            - NODE_ENV=development
            - VITE_UI_COMPONENTS_PATH=/app/react-ui-components

        # See server-dev: the dev image declares no HEALTHCHECK either.
        healthcheck:
            test: ["CMD", "node", "-e", "const get = (u) => new Promise((done) => require(u.split(':')[0]).get(u, { rejectUnauthorized: false }, (r) => done(r.statusCode)).on('error', () => done(0))); let f; try { f = JSON.parse(require('fs').readFileSync('/tmp/dim-health.json', 'utf8')).url; } catch {} const u = '://127.0.0.1:' + (process.env.DIM_CLIENT_PORT || 3001) + '/api/health'; (f ? get(f) : get('http' + u).then((s) => s || get('https' + u))).then((s) => process.exit(s === 200 ? 0 : 1))"]
            interval: 15s
            timeout: 5s
            start_period: 45s
            retries: 3

secrets:
    npm_token:
        environment: NPM_TOKEN
