services:
    dim-server:
        container_name: dim-server
        build:
            context: .
            dockerfile: docker/Dockerfile.server
        image: dim-server:latest
        ports:
            - "3000:3000"
        volumes:
            # Persist SQLite database and other data
            - server-data:/app/server/backend/data
            # Persist configuration (ensure this file exists or is created)
            - ./server-config.yaml:/app/server/config.yaml
        restart: unless-stopped
        environment:
            - NODE_ENV=production
        # Repeats the image's HEALTHCHECK so it is visible in the file operators edit.
        # It asks the address the server writes to /tmp/dim-health.json once it listens, so it
        # follows a port set in config.yaml as well as DIM_SERVER_PORT. That takes an image
        # which writes the file: an older tag reports unhealthy under this block.
        # Docker does NOT restart an unhealthy container -- `restart:` reacts to the process
        # exiting. The state shows in `docker ps` and works with
        # `depends_on: condition: service_healthy`.
        healthcheck:
            test: ["CMD", "node", "-e", "Promise.resolve().then(() => fetch(JSON.parse(require('fs').readFileSync('/tmp/dim-health.json', 'utf8')).url)).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
            interval: 30s
            timeout: 5s
            start_period: 20s
            retries: 3

    dim-client:
        container_name: dim-client
        build:
            context: .
            dockerfile: docker/Dockerfile.client
        image: dim-client:latest
        # Both sides follow the agent's listenPort / DIM_CLIENT_PORT. With
        # network_mode: host this mapping does not apply at all, which is the case
        # DIM_CLIENT_PORT exists for.
        ports:
            - "3001:3001"
        volumes:
            # Docker socket for container management
            - /var/run/docker.sock:/var/run/docker.sock
            # Persist client configuration
            - ./client-config.yaml:/app/client/config.yaml
            # The agent's own state: the identity it was issued at registration, the
            # auto-update policy the server sent it, its schedule state, and activity
            # events the server has not acknowledged yet.
            # A named volume, and it has to stay one -- the line above is a single-file
            # bind mount, so anything written beside config.yaml lives in the container
            # and is gone with the next recreate, which is every self-update. The agent
            # would then come back without its policy and unregistered. Losing this volume
            # means registering the agent again. DIM_CLIENT_DATA_DIR moves the directory
            # for an agent that runs outside compose.
            - client-data:/app/client/data
        restart: unless-stopped
        environment:
            - NODE_ENV=production
            # The clock auto-update cron expressions run on. Without it the agent uses UTC,
            # so "0 3 * * *" is 03:00 UTC.
            # - TZ=Europe/Berlin
            # Outbound registration takes the setup PIN from `docker logs dim-client`. For an
            # unattended rollout give the agent a secret the Add Client wizard accepts instead
            # (with the two `secrets:` blocks below). Remove it once the agent is registered.
            # - DIM_REGISTRATION_SECRET_FILE=/run/secrets/dim_registration
        # secrets:
        #     - dim_registration
        # Reports on the agent, not on its server connection: an agent that cannot reach the
        # server is still healthy. The route is served whatever config.yaml disables, and
        # answers loopback only -- the probe runs inside the container, so it gets an answer
        # where nobody else does. It asks the port and scheme the agent reports in
        # /tmp/dim-health.json once it listens, so listenPort and `tls` in config.yaml are
        # followed as well as DIM_CLIENT_PORT; an image from before that file asks
        # DIM_CLIENT_PORT, HTTP first, then HTTPS -- see docker/Dockerfile.client.
        healthcheck:
            test: ["CMD", "node", "-e", "const get = (u) => new Promise((done) => require(u.split(':')[0]).get(u, { rejectUnauthorized: false }, (r) => done(r.statusCode)).on('error', () => done(0))); let f; try { f = JSON.parse(require('fs').readFileSync('/tmp/dim-health.json', 'utf8')).url; } catch {} const u = '://127.0.0.1:' + (process.env.DIM_CLIENT_PORT || 3001) + '/api/health'; (f ? get(f) : get('http' + u).then((s) => s || get('https' + u))).then((s) => process.exit(s === 200 ? 0 : 1))"]
            interval: 30s
            timeout: 5s
            start_period: 20s
            retries: 3

volumes:
    server-data:
    client-data:

