# Docker Instance Manager - Server Configuration
#
# Checked on every start: a value of the wrong type or format stops the server with a log
# line naming the field (e.g. "security.allowed_networks.0: Must be an IPv4 address ...").

# Log level for the server (trace, debug, info, warn, error, fatal)
# Can be overridden by the LOG_LEVEL environment variable
logLevel: info

# Port the server listens on. Defaults to 3000 when left out.
# Can be overridden by the DIM_SERVER_PORT environment variable; an unusable value ends
# the start. This is the published port: the container exposes it and compose.yaml maps it,
# so moving it here means moving it there too.
#port: 3000

# OpenID Connect (OIDC) authentication settings
oidc:
    enabled: false
    issuer:
    client_id:
    client_secret:
    redirect_uri:

# Secret key used to sign and verify JSON Web Tokens (JWT) for user sessions
# This should be a long, random string
jwtSecret:

# JWT token expiration time (e.g. "24h", "7d", "30m"). Defaults to "12h" if not set.
# Tokens always expire; there is no setting that turns expiry off. The dashboard's
# session cookies carry the same lifetime.
jwtExpiresIn: "12h"

# General server settings
settings:
    # Number of days an invalid (used or expired) registration token is kept before the
    # cleanup removes it. Set to "0" to remove every invalid token on the next run.
    token_retention_days: "30"
    # How often the token cleanup runs, in hours. Set to "0" to disable the scheduler
    # (manual runs via the Settings page still work).
    token_cleanup_interval_hours: "24"

    # Maximum age (in days) of a cached check result before it is removed by the cleanup 
    # sweep. Measured against checked_at. Set to "0" to disable expiry-based cleanup 
    # (orphan cleanup still runs if enabled).
    image_version_cache_ttl_days: "30"
    # Whether the cleanup sweep should also remove entries whose image_ref (tag) is no
    # longer referenced by any client's docker_state. Accepts "true" or "false".
    image_version_cache_cleanup_orphans: "true"
    # Interval (in hours) at which the automatic cleanup scheduler runs. Set to "0"
    # to disable the scheduler entirely
    image_version_cache_cleanup_interval_hours: "24"

    # Interval (in seconds) at which all images from all clients are checked against
    # their registry for available updates. Results are stored in the update-check
    # cache and shown in the UI. Set to "0" to disable the scheduler (manual runs
    # via the Settings page still work). Example: 3600 = every hour.
    # A registry that answers with a rate limit (429) is left out of the runs for
    # as long as its Retry-After header says (an hour without one); the other
    # registries are checked as before.
    image_update_check_interval_seconds: "0"

    # The default auto-update schedule, inherited by every host and project that
    # names none of its own. The server runs no auto-update itself: it resolves the
    # inheritance and sends each agent the expressions it is to act on, and the agent
    # runs them on its own clock. Leave empty and only hosts and projects with an
    # expression of their own take part. Example: "0 3 * * *" (every day at 3 AM).
    container_auto_update_cron: ""
    # Docker label that marks a container for automatic image updates. Accepts
    # either "key=value" or just "key" (then any value matches). The same key
    # carrying "false" opts a container out, whatever its project says.
    container_auto_update_label: "dim.auto-update=true"
    # Docker label that controls the update delay per container. The label value
    # specifies the minimum age in days a new image must have before it is applied.
    # Example: a container with "dim.auto-update-delay=3" is only updated when the
    # new image is at least 3 days old. Leave empty to disable delay support.
    container_auto_update_delay_label: "dim.auto-update-delay"

# Security network settings
security:
    # IPv4 addresses or CIDR networks an agent may open its WebSocket session (/ws/agent)
    # from. Applies to all agents alike; empty allows every address.
    # Which address a single inbound client must connect from is a property of that client:
    # set at registration to the address it registered from, and editable (or switched off)
    # in the client editor.
    allowed_networks: []
    # Send the Strict-Transport-Security header (default: false). Only enable this when the
    # dashboard is reached exclusively via HTTPS: browsers remember the header for months and
    # refuse plain http:// for this host from then on, even after it is switched off again.
    # hsts: false
    # Accept a certificate this server cannot verify when dialling an outbound agent over
    # wss:// (default: false). Applies to every outbound agent alike.
    # Only relevant for clients whose target address is written as wss://host:port; a plain
    # host:port is dialled over ws:// and has no certificate to check in the first place.
    # Enable it for agents carrying a self-signed certificate, which is the usual case on a
    # home network. With a certificate from a CA this host trusts, leave it off -- the
    # session it protects carries the agent's auth token.
    # allow_self_signed_agent_certificates: false
